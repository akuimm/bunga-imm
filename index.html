<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AR Gallery</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
<model-viewer 
    id="ar-model"
    src="Untitled.glb"
    ios-src="Untitled.usdz"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1" 
    auto-rotate 
    style="width: 100%; height: 500px;">
    
    <button slot="ar-button" id="ar-btn-text" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
        Lihat dalam AR
</model-viewer>

<div style="text-align: center; margin-top: 20px;">
    <button onclick="pilihModel('Untitled.glb', 'Untitled.usdz')" 
            style="padding: 10px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc;">
        🌻 Munculkan Bunga
    </button>
    
    <button onclick="pilihModel('bangunan.glb', 'bangunan.usdz')" 
            style="padding: 10px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid #ccc;">
        🏠 Munculkan Bangunan
        
    </button>
</div>
</button>
<script>
    function pilihModel(glbFile, usdzFile, teksTombol) {
        const modelViewer = document.querySelector('#ar-model');
        const buttonText = document.querySelector('#ar-btn-text');

        // Proses mengganti file model
        modelViewer.src = glbFile;
        modelViewer.iosSrc = usdzFile;
        
        // Mengubah teks pada tombol AR agar sesuai dengan objek yang dipilih
        buttonText.innerHTML = teksTombol;

        console.log("Model sekarang: " + glbFile);
    }
</script>

    

</body>
</html>
