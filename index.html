<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AR Gallery</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

<model-viewer 
    id="ar-model"
    src="Untitledd.glb"
    ios-src="Untitled.usdz"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1" 
    auto-rotate 
    style="width: 100%; height: 500px;">
    
    <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px; z-index: 100;">
        <span id="teks-ar">Lihat Bunga dalam AR!!</span>
    </button>
</model-viewer>

<div style="text-align: center; margin-top: 20px;">
    <button onclick="pilihModel('Untitledd.glb', 'Untitledd.usdz', 'Lihat Gerobak AR!!')" 
            style="padding: 10px; margin: 5px; cursor: pointer; border-radius: 8px;">
        🌻 Munculkan Gerobak
    </button>
    
    <button onclick="pilihModel('bangunan.glb', 'bangunan.usdz', 'Lihat Gedung dalam AR!!')" 
            style="padding: 10px; margin: 5px; cursor: pointer; border-radius: 8px;">
        🏠 Munculkan Bangunan
    </button>
</div>

<script>
    function pilihModel(glbFile, usdzFile, teksBaru) {
        const mv = document.querySelector('#ar-model');
        const txt = document.querySelector('#teks-ar');

        // Ganti sumber file
        mv.src = glbFile;
        mv.iosSrc = usdzFile;
        
        // Ganti teks tombol AR secara otomatis
        txt.textContent = teksBaru;

        console.log("Berhasil pindah ke: " + teksBaru);
    }
</script>

</body>
</html>
